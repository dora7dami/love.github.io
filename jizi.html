<!DOCTYPE html>
<html lang="zh-CN">
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>旋转爱心 💕</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: radial-gradient(ellipse at center, #1a0a2e, #0a0a1a 70%, #050510);
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
  }

  /* 星星背景 */
  .stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
  }
  .stars span {
    position: absolute;
    border-radius: 50%;
    background: rgba(255,255,255,.8);
    animation: twinkle var(--d, 3s) ease-in-out infinite;
  }
  @keyframes twinkle {
    0%,100% { opacity: .2; transform: scale(.8); }
    50% { opacity: 1; transform: scale(1.2); }
  }

  /* 爱心容器 */
  .heart-container {
    position: relative;
    width: 400px;
    height: 400px;
    animation: heartBeat 2s ease-in-out infinite;
  }
  @keyframes heartBeat {
    0%,100% { transform: scale(1); }
    15% { transform: scale(1.08); }
    30% { transform: scale(1); }
    45% { transform: scale(1.04); }
    60% { transform: scale(1); }
  }

  /* 每张小图 */
  .heart-item {
    position: absolute;
    width: 50px;
    height: 50px;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 4px 15px rgba(255,110,196,.3), 0 0 10px rgba(200,168,255,.2);
    border: 2px solid rgba(255,255,255,.2);
    animation: orbit var(--orbit-duration, 12s) linear infinite;
    animation-delay: var(--delay, 0s);
    transform-origin: center center;
  }
  .heart-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    animation: spin 4s linear infinite;
  }

  @keyframes orbit {
    from { transform: rotate(var(--start-angle, 0deg)) translateX(var(--radius, 140px)) rotate(calc(-1 * var(--start-angle, 0deg))); }
    to { transform: rotate(calc(var(--start-angle, 0deg) + 360deg)) translateX(var(--radius, 140px)) rotate(calc(-1 * (var(--start-angle, 0deg) + 360deg))); }
  }
  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  /* 爱心中心文字 */
  .heart-center {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    z-index: 10;
    pointer-events: none;
  }
  .heart-center .emoji {
    font-size: 48px;
    animation: pulse 2s ease-in-out infinite;
  }
  .heart-center .text {
    margin-top: 8px;
    font-size: 14px;
    color: rgba(255,255,255,.7);
    letter-spacing: 1px;
  }
  @keyframes pulse {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.15); }
  }

  /* 标题 */
  .title {
    position: fixed;
    top: 40px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 22px;
    font-weight: 700;
    background: linear-gradient(135deg, #ff9ecd, #c8a8ff, #ff6ec4);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: 2px;
    animation: titleGlow 3s ease-in-out infinite;
    white-space: nowrap;
  }
  @keyframes titleGlow {
    0%,100% { filter: brightness(1); }
    50% { filter: brightness(1.3); }
  }

  /* 底部提示 */
  .hint {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,.3);
    font-size: 12px;
    letter-spacing: 1px;
  }

  @media (max-width: 480px) {
    .heart-container { width: 320px; height: 320px; }
    .heart-item { width: 40px; height: 40px; }
    .title { font-size: 17px; top: 24px; }
    .heart-center .emoji { font-size: 36px; }
  }
</style>
</head>
<body>

<div class="title">❤️ 每一张都是你 ❤️</div>

<div class="stars" id="stars"></div>

<div class="heart-container" id="heartContainer">
  <!-- 中心 -->
  <div class="heart-center">
    <div class="emoji">💖</div>
    <div class="text">爱你</div>
  </div>
  <!-- JS 动态生成图片 -->
</div>

<div class="hint">每一张小图都在绕着爱心的轨迹旋转 ✨</div>

<script>
  // 星星
  const starsEl = document.getElementById('stars');
  for (let i = 0; i < 50; i++) {
    const s = document.createElement('span');
    s.style.left = Math.random() * 100 + '%';
    s.style.top = Math.random() * 100 + '%';
    s.style.width = s.style.height = (Math.random() * 3 + 1) + 'px';
    s.style.setProperty('--d', (Math.random() * 4 + 2) + 's');
    s.style.animationDelay = Math.random() * 4 + 's';
    starsEl.appendChild(s);
  }

  // 生成爱心轨迹上的点
  // 爱心参数方程: x = 16sin³(t), y = -(13cos(t) - 5cos(2t) - 2cos(3t) - cos(4t))
  function heartPoint(t) {
    const x = 16 * Math.pow(Math.sin(t), 3);
    const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
    return { x, y };
  }

  const container = document.getElementById('heartContainer');
  const count = 24; // 图片数量
  const scale = 12; // 爱心大小缩放

  for (let i = 0; i < count; i++) {
    const t = (i / count) * Math.PI * 2;
    const pt = heartPoint(t);

    // 爱心坐标 → 容器中心偏移
    const cx = 200 + pt.x * scale;
    const cy = 200 + pt.y * scale;

    const item = document.createElement('div');
    item.className = 'heart-item';
    item.style.left = (cx - 25) + 'px';
    item.style.top = (cy - 25) + 'px';
    item.style.setProperty('--start-angle', (t * 180 / Math.PI) + 'deg');
    item.style.setProperty('--radius', '140px');
    item.style.setProperty('--orbit-duration', (10 + (i % 4) * 2) + 's');
    item.style.setProperty('--delay', (-i * 0.5) + 's');

    const img = document.createElement('img');
    // ★ 替换成你自己的图片路径，可以用同一张或不同张
    img.src = './ji.jpg?random=' + i;
    img.alt = 'photo';

    item.appendChild(img);
    container.appendChild(item);
  }
</script>

</body>
</html>
