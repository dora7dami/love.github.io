<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>鸡子飞 💕</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: radial-gradient(ellipse at center, #1a0a2e, #0a0a1a 70%, #050510);
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
  }

  .scene {
    position: relative;
    width: 420px;
    height: 420px;
  }

  /* 每张照片 */
  .photo-piece {
    position: absolute;
    width: 36px;
    height: 36px;
    border-radius: 6px;
    overflow: hidden;
    box-shadow: 0 2px 10px rgba(255,110,196,.3);
    border: 1.5px solid rgba(255,255,255,.25);
    opacity: 0;
    transition: all 1.2s cubic-bezier(.34,1.56,.64,1);
  }
  .photo-piece img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* 爱心形成后的脉冲 */
  .scene.formed .photo-piece {
    animation: pieceFloat 3s ease-in-out infinite;
  }
  @keyframes pieceFloat {
    0%,100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-3px) rotate(1deg); }
  }

  /* 中心爱心 */
  .center-heart {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0);
    font-size: 52px;
    z-index: 5;
    transition: transform 0.8s cubic-bezier(.34,1.56,.64,1);
    pointer-events: none;
  }
  .center-heart.show {
    transform: translate(-50%, -50%) scale(1);
    animation: heartPulse 2s ease-in-out infinite 0.8s;
  }
  @keyframes heartPulse {
    0%,100% { transform: translate(-50%, -50%) scale(1); }
    50% { transform: translate(-50%, -50%) scale(1.15); }
  }

  /* 文字 */
  .center-text {
    position: absolute;
    top: 60%;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    color: rgba(255,255,255,.8);
    font-size: 14px;
    letter-spacing: 2px;
    opacity: 0;
    transition: opacity 1s ease 2s;
    white-space: nowrap;
    z-index: 5;
    pointer-events: none;
  }
  .center-text.show { opacity: 1; }

  /* 标题 */
  .title {
    position: fixed;
    top: 40px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 22px;
    font-weight: 700;
    background: linear-gradient(135deg, #ff9ecd, #c8a8ff, #ff6ec4);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: 2px;
    animation: titleGlow 3s ease-in-out infinite;
    white-space: nowrap;
  }
  @keyframes titleGlow {
    0%,100% { filter: brightness(1); }
    50% { filter: brightness(1.3); }
  }

  /* 按钮 */
  .start-btn {
    position: fixed;
    bottom: 60px;
    left: 50%;
    transform: translateX(-50%);
    padding: 14px 44px;
    border-radius: 50px;
    background: linear-gradient(135deg, #ff6ec4, #9b59b6);
    color: #fff;
    font-size: 17px;
    font-weight: 600;
    border: none;
    cursor: pointer;
    letter-spacing: 2px;
    box-shadow: 0 8px 30px rgba(255,110,196,.4);
    transition: all .3s ease;
    z-index: 100;
  }
  .start-btn:hover {
    transform: translateX(-50%) scale(1.06);
    box-shadow: 0 12px 40px rgba(255,110,196,.6);
  }
  .start-btn.hidden {
    opacity: 0;
    pointer-events: none;
    transform: translateX(-50%) scale(0.8);
  }

  @media (max-width: 480px) {
    .scene { width: 340px; height: 340px; }
    .photo-piece { width: 28px; height: 28px; }
    .title { font-size: 17px; top: 24px; }
    .center-heart { font-size: 40px; }
  }
</style>
</head>
<body>

<div class="title">❤️ 鸡子飞起来了了 ❤️</div>

<div class="scene" id="scene">
  <div class="center-heart" id="centerHeart">💖</div>
  <div class="center-text" id="centerText">拼成了 · 爱心鸡</div>
</div>

<button class="start-btn" id="startBtn" onclick="start()">点击开始让鸡子飞 ✨</button>

<script>
  const scene = document.getElementById('scene');
  const centerHeart = document.getElementById('centerHeart');
  const centerText = document.getElementById('centerText');
  const startBtn = document.getElementById('startBtn');

  // 爱心参数方程
  function heartPoint(t) {
    const x = 16 * Math.pow(Math.sin(t), 3);
    const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
    return { x, y };
  }

  // 生成爱心上的所有点
  function generateHeartPoints(num) {
    const points = [];
    for (let i = 0; i < num; i++) {
      const t = (i / num) * Math.PI * 2;
      const pt = heartPoint(t);
      points.push(pt);
    }
    return points;
  }

  const totalPieces = 60; // 照片数量
  const points = generateHeartPoints(totalPieces);
  const pieces = [];

  // 创建所有照片碎片
  for (let i = 0; i < totalPieces; i++) {
    const piece = document.createElement('div');
    piece.className = 'photo-piece';

    const img = document.createElement('img');
    // ★ 换成你自己的照片路径
    img.src = './ji.jpg';
    img.alt = 'photo';

    piece.appendChild(img);
    scene.appendChild(piece);
    pieces.push(piece);
  }

  function start() {
    startBtn.classList.add('hidden');

    const sceneRect = scene.getBoundingClientRect();
    const centerX = 210;
    const centerY = 210;
    const scale = 10;

    pieces.forEach((piece, i) => {
      // 随机散开起始位置
      const angle = Math.random() * Math.PI * 2;
      const dist = 200 + Math.random() * 300;
      const startX = centerX + Math.cos(angle) * dist;
      const startY = centerY + Math.sin(angle) * dist;
      const startRotate = Math.random() * 720 - 360;

      // 目标爱心位置
      const pt = points[i];
      const targetX = centerX + pt.x * scale - 18; // 18 = half width
      const targetY = centerY + pt.y * scale - 18;
      const targetRotate = (Math.random() - 0.5) * 20; // 轻微随机旋转

      // 先设到散开位置
      piece.style.left = startX + 'px';
      piece.style.top = startY + 'px';
      piece.style.transform = `rotate(${startRotate}deg) scale(0.3)`;
      piece.style.opacity = '0';

      // 强制重排
      piece.offsetHeight;

      // 延迟后飞向爱心位置
      const delay = i * 30 + Math.random() * 200;
      setTimeout(() => {
        piece.style.left = targetX + 'px';
        piece.style.top = targetY + 'px';
        piece.style.transform = `rotate(${targetRotate}deg) scale(1)`;
        piece.style.opacity = '1';
      }, delay);
    });

    // 爱心形成后
    setTimeout(() => {
      scene.classList.add('formed');
      centerHeart.classList.add('show');
      centerText.classList.add('show');
    }, totalPieces * 30 + 800);
  }
</script>

</body>
</html>
